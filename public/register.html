<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unirme a la lista — Kōhi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">Kōhi</a>
      <span class="kanji">珈琲</span>
    </header>

    <main class="center-stage">
      <section class="card">
        <div id="formView">
          <p class="eyebrow">Lista de espera</p>
          <h1 class="card__title">Unirme a la lista</h1>
          <p class="card__intro">
            Te avisaremos antes de la apertura y tendrás sitio reservado en la primera cata.
          </p>

          <p class="message" id="message" role="alert" hidden></p>

          <form id="registerForm" novalidate>
            <div class="field">
              <label for="name">Nombre</label>
              <input type="text" id="name" name="name" autocomplete="name" placeholder="Tu nombre" required />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" autocomplete="email" placeholder="tu@email.com" required />
            </div>

            <div class="field">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" autocomplete="new-password" placeholder="••••••••" required />
              <p class="field__hint">Mínimo 8 caracteres.</p>
            </div>

            <div class="field">
              <label for="confirm">Confirmar contraseña</label>
              <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="••••••••" required />
            </div>

            <button class="btn btn--primary btn--block" type="submit" id="submitBtn">Reservar mi sitio</button>
          </form>

          <p class="card__foot">
            ¿Ya te apuntaste? <a href="login.html">Entra a tu cuenta</a>
          </p>
        </div>

        <div class="success-panel" id="successView" hidden>
          <p class="eyebrow">Registro confirmado</p>
          <h1 class="success-panel__title">¡Estás en la lista!</h1>
          <p class="success-panel__position" id="positionBig">#0</p>
          <p class="card__intro" id="positionDetail">Tu posición: #0</p>
          <a class="btn btn--primary btn--block" id="continueBtn" href="dashboard.html">Ver mi panel</a>
        </div>
      </section>
    </main>

    <footer class="site-footer">Kōhi · Lista de espera abierta</footer>

    <script src="app.js"></script>
    <script>
      const MIN_PASSWORD = 8;

      const form = document.getElementById('registerForm');
      const message = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const formView = document.getElementById('formView');
      const successView = document.getElementById('successView');

      function showSuccess(position, total) {
        document.getElementById('positionBig').textContent = `#${position}`;
        document.getElementById('positionDetail').textContent =
          `Tu posición: #${position}` + (total ? ` de ${total} personas en la cola.` : '.');
        formView.hidden = true;
        successView.hidden = false;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearFlash(message);

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (!name || !email || !password) {
          flash(message, 'Rellena tu nombre, tu email y una contraseña.');
          return;
        }
        if (password.length < MIN_PASSWORD) {
          flash(message, `La contraseña debe tener al menos ${MIN_PASSWORD} caracteres.`);
          return;
        }
        if (password !== confirm) {
          flash(message, 'Las dos contraseñas no coinciden.');
          return;
        }

        busy(submitBtn, true, 'Reservar mi sitio');
        const registered = await api('/api/register', {
          method: 'POST',
          body: { name, email, password },
        });

        if (!registered.ok) {
          busy(submitBtn, false, 'Reservar mi sitio');
          flash(message, registered.data.error || 'No hemos podido apuntarte.');
          return;
        }

        // El registro no devuelve token: iniciamos sesión con las mismas
        // credenciales para que el panel esté accesible sin volver a escribirlas.
        const loggedIn = await api('/api/login', { method: 'POST', body: { email, password } });
        busy(submitBtn, false, 'Reservar mi sitio');

        if (loggedIn.ok) {
          auth.set(loggedIn.data.token);
        } else {
          const continueBtn = document.getElementById('continueBtn');
          continueBtn.href = 'login.html';
          continueBtn.textContent = 'Entrar a mi cuenta';
        }

        showSuccess(registered.data.position, registered.data.total);
      });
    </script>
  </body>
</html>
