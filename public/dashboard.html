<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi panel — Kōhi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="index.html">Kōhi</a>
      <span class="kanji">珈琲</span>
    </header>

    <main>
      <p class="is-loading" id="loading">Cargando tu sitio en la cola…</p>

      <section class="dashboard" id="dashboard" hidden>
        <p class="eyebrow">Tu pase de apertura</p>
        <h1 class="dashboard__greeting">Hola, <em id="userName">—</em></h1>

        <p class="message" id="message" role="alert" hidden></p>

        <section class="panel queue">
          <p class="eyebrow">Posición en la cola</p>
          <p class="queue__figure">
            Eres el <strong id="position">#0</strong> <span>de <span id="total">0</span></span>
          </p>

          <div class="progress" role="progressbar" id="progress"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
               aria-label="Avance en la lista de espera">
            <div class="progress__bar" id="progressBar"></div>
          </div>

          <p class="progress__legend">
            <span>Cabeza de la cola</span>
            <span id="aheadLabel">—</span>
          </p>
        </section>

        <section class="panel pass">
          <p class="eyebrow">Código de invitación</p>
          <canvas class="pass__canvas" id="qrCanvas" width="208" height="208"
                  role="img" aria-label="Código QR de invitación"></canvas>
          <p class="pass__code" id="passCode">QR-KOHI-0000</p>
          <p class="pass__note">
            Enséñalo en la barra el día de la apertura. Código ficticio para la demo.
          </p>
        </section>

        <div class="dashboard__actions">
          <button class="btn btn--ghost" type="button" id="logoutBtn">Cerrar sesión</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">Kōhi · Lista de espera abierta</footer>

    <script src="app.js"></script>
    <script>
      const loading = document.getElementById('loading');
      const dashboard = document.getElementById('dashboard');
      const message = document.getElementById('message');

      function goToLogin() {
        auth.clear();
        window.location.replace('login.html');
      }

      function render({ name, position, total }) {
        const safeTotal = Math.max(total || 0, position);
        const ahead = position - 1;

        document.getElementById('userName').textContent = name;
        document.getElementById('position').textContent = `#${position}`;
        document.getElementById('total').textContent = safeTotal;
        document.getElementById('aheadLabel').textContent =
          ahead === 0 ? 'Nadie por delante' : `${ahead} por delante`;

        // Cuanto más cerca del puesto 1, más llena está la barra.
        const percent = safeTotal > 0 ? ((safeTotal - position + 1) / safeTotal) * 100 : 100;
        const rounded = Math.round(percent);
        const progress = document.getElementById('progress');
        progress.setAttribute('aria-valuenow', String(rounded));
        progress.setAttribute('aria-valuetext', `Puesto ${position} de ${safeTotal}`);

        const code = passCode(position);
        document.getElementById('passCode').textContent = code;
        drawFakeQr(document.getElementById('qrCanvas'), code);

        loading.hidden = true;
        dashboard.hidden = false;

        // Se anima después de mostrar el panel para que la transición se vea.
        requestAnimationFrame(() => {
          document.getElementById('progressBar').style.width = `${percent}%`;
        });
      }

      document.getElementById('logoutBtn').addEventListener('click', goToLogin);

      (async function init() {
        const token = auth.get();
        if (!token) {
          goToLogin();
          return;
        }

        const { ok, status, data } = await api('/api/me', { token });

        if (status === 401) {
          goToLogin();
          return;
        }

        if (!ok) {
          loading.hidden = true;
          dashboard.hidden = false;
          flash(message, data.error || 'No hemos podido cargar tus datos.');
          return;
        }

        render(data);
      })();
    </script>
  </body>
</html>
